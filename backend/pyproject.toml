[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeiq-api"
version = "0.1.0"
description = "ResumeIQ evidence-based resume intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "aiosqlite>=0.20,<1.0",
  "alembic>=1.14,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "argon2-cffi>=23.1,<24.0",
  "pyjwt>=2.10,<3.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "redis>=5.2,<7.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.9,<1.0",
  "reportlab>=4.0,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
